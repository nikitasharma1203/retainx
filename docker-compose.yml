services:
  postgres:
    image: postgres:16
    container_name: retainx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retainx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retainx}
      POSTGRES_DB: ${POSTGRES_DB:-retainx}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_create_schema.sql:/docker-entrypoint-initdb.d/00_create_schema.sql:ro
volumes:
  pgdata:
